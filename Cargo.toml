[workspace]
resolver = "2"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Aischii/AsagiType"
authors = ["Aischii"]

[workspace.dependencies]
at2k = { path = "crates/at2k" }
provider = { path = "crates/provider" }
render = { path = "crates/render" }
vision = { path = "crates/vision" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
imagesize = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
